<dialog class="dlg dlg--drawer" id="bag" aria-labelledby="bag-title">
  <div class="drawer" tabindex="-1" autofocus>
    <header class="drawer__head">
      <h2 id="bag-title">Your bag</h2>
      <span class="drawer__count" data-bag-items>0 packs</span>
      <button class="icon-btn" type="button" data-close aria-label="Close your bag"><i data-icon="close"></i></button>
    </header>
    <div class="drawer__body" data-lenis-prevent>
      <div class="drawer__empty" data-bag-empty>
        <svg viewBox="0 0 100 124" aria-hidden="true"><use href="#tupat-shape"></use></svg>
        <h3>Your bag is empty</h3>
        <p>Pick a rendang and it lands here.</p>
        <a class="btn btn--cili" href="shop.html"><i data-icon="bag"></i>Shop rendang</a>
      </div>
      <ul class="bag-list" data-bag-list></ul>
    </div>
    <footer class="drawer__foot" data-bag-full hidden>
      <div class="drawer__fields">
        <div class="field"><label for="bag-name">Your name</label><input id="bag-name" name="bag-name" autocomplete="name"></div>
        <div class="field"><label for="bag-area">Deliver to</label><input id="bag-area" name="bag-area" placeholder="Town or area"></div>
        <div class="field drawer__date"><label for="bag-date">Needed by (optional)</label><input id="bag-date" name="bag-date" placeholder="e.g. before Raya, 28 March"></div>
      </div>
      <div class="drawer__total"><span>Subtotal</span><strong data-bag-subtotal>RM0.00</strong></div>
      <p class="drawer__note">The team confirms your total, payment and frozen delivery for your area on WhatsApp.</p>
      <p class="drawer__note" data-bag-note hidden>*Proposed set price, to be confirmed by Rumpun Selera.</p>
      <a class="btn btn--cili btn--block" data-bag-checkout href="https://wa.me/601169825208" target="_blank" rel="noopener"><i data-icon="whatsapp"></i>Order on WhatsApp</a>
      <a class="btn btn--white btn--block" href="tel:+601169825208"><i data-icon="phone"></i>Call +60 11-6982 5208</a>
      <button class="link-btn" type="button" data-bag-clear>Empty the bag</button>
    </footer>
  </div>
</dialog>
