<dialog class="dlg dlg--quick" id="dlg-quick" aria-labelledby="q-title">
  <div class="quick" tabindex="-1" autofocus>
    <button class="icon-btn dlg__x" type="button" data-close aria-label="Close"><i data-icon="close"></i></button>
    <div class="quick__art">
      <img data-q="img" src="assets/img/packs/minang.webp" alt="" width="717" height="1100">
      <span class="quick__badge" data-q="badge" hidden></span>
    </div>
    <div class="quick__body">
      <p class="quick__kicker" data-q="kicker"></p>
      <h2 class="quick__name" id="q-title" data-q="name"></h2>
      <p class="quick__tag" data-q="tag"></p>
      <p class="quick__blurb" data-q="blurb"></p>
      <ul class="quick__facts">
        <li><i data-icon="snowflake"></i>Keep frozen</li>
        <li><i data-icon="clock"></i>Ready in 5 minutes</li>
        <li><i data-icon="users"></i><span data-q="serves"></span></li>
      </ul>
      <div class="sizes" data-q-size role="group" aria-label="Pack size"></div>
      <div class="quick__buy">
        <div class="qty"><button type="button" data-q-step="-1" aria-label="One less"><i data-icon="minus"></i></button><input data-q-qty type="number" min="1" max="99" value="1" aria-label="Quantity"><button type="button" data-q-step="1" aria-label="One more"><i data-icon="plus"></i></button></div>
        <strong class="quick__price" data-q="price"></strong>
      </div>
      <p class="quick__note" data-q-note hidden>*Proposed set price, to be confirmed by Rumpun Selera.</p>
      <div class="quick__ctas">
        <button class="btn btn--cili" type="button" data-q-add><i data-icon="bag"></i>Add to bag</button>
        <a class="btn btn--white" data-q-ask href="https://wa.me/601169825208" target="_blank" rel="noopener"><i data-icon="whatsapp"></i>Ask on WhatsApp</a>
      </div>
      <a class="link" data-q-link href="product.html">See full details</a>
    </div>
  </div>
</dialog>

<dialog class="dlg dlg--info" id="dlg-info" aria-labelledby="i-title">
  <div class="info" tabindex="-1" autofocus>
    <button class="icon-btn dlg__x" type="button" data-close aria-label="Close"><i data-icon="close"></i></button>
    <div class="info__art">
      <span class="info__icon" data-i="icon" hidden></span>
      <img data-i="img" src="assets/img/brand/badge-sm.webp" alt="" hidden>
    </div>
    <p class="info__kicker" data-i="kicker"></p>
    <h2 class="info__title" id="i-title" data-i="title"></h2>
    <p class="info__body" data-i="body"></p>
    <div class="info__ctas">
      <a class="btn btn--cili" data-i="cta" href="index.html" hidden><span data-i="cta-label">More</span></a>
      <button class="btn btn--white" type="button" data-i="video" data-lightbox="assets/video/reel-raya.mp4" hidden><i data-icon="play"></i>Watch the reel</button>
    </div>
  </div>
</dialog>

<dialog class="dlg dlg--lightbox" id="dlg-lightbox" aria-label="Photo and video viewer">
  <div class="lb" tabindex="-1" autofocus>
    <button class="icon-btn dlg__x" type="button" data-close aria-label="Close"><i data-icon="close"></i></button>
    <button class="icon-btn lb__nav" type="button" data-lb-prev aria-label="Previous" hidden><i data-icon="chevron-left"></i></button>
    <figure class="lb__figure">
      <div class="lb__media" data-lb-media></div>
      <figcaption class="lb__caption"><span data-lb-caption></span><span class="lb__count" data-lb-count></span></figcaption>
    </figure>
    <button class="icon-btn lb__nav" type="button" data-lb-next aria-label="Next" hidden><i data-icon="chevron-right"></i></button>
  </div>
</dialog>
